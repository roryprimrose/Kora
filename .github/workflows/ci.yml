name: CI
run-name: "${{ inputs.queue_ticket && format('Merge queue PR #{0} [{1}]', inputs.queue_pr, inputs.queue_ticket) || format('CI {0}', github.ref_name) }}"

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  # Allows maintainers to run the same CI checks manually from the Actions page.
  workflow_dispatch:
    inputs:
      compare_portable_tests:
        description: Compare sequential and parallel portable tests on one runner
        type: boolean
        default: false
      compare_native_evidence:
        description: Compare synchronous and buffered headless fixture evidence
        type: boolean
        default: false
      queue_pr:
        description: Controller-owned candidate PR number; leave empty for ordinary manual CI
        type: string
      queue_head:
        description: Controller-owned candidate source SHA
        type: string
      queue_base:
        description: Controller-owned main SHA
        type: string
      queue_ticket:
        description: Controller-owned admission ticket
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ inputs.queue_ticket && 'merge-queue-candidate' || github.event.pull_request.head.ref || github.ref_name }}${{ (inputs.compare_portable_tests || inputs.compare_native_evidence) && '-test-comparison' || '' }}
  cancel-in-progress: ${{ !inputs.queue_ticket }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  admission:
    name: Admit CI execution
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.admit.outputs.full }}
      source: ${{ steps.admit.outputs.source }}
      candidate: ${{ steps.admit.outputs.candidate }}
    steps:
      - name: Check out trusted candidate admission policy
        if: vars.KORA_MERGE_QUEUE_MODE == 'enabled'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false

      - name: Admit ordinary or selected validation
        id: admit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          QUEUE_MODE: ${{ vars.KORA_MERGE_QUEUE_MODE }}
          QUEUE_INPUTS: ${{ toJSON(inputs) }}
          QUEUE_APP_ID: ${{ vars.KORA_MERGE_QUEUE_APP_ID }}
        with:
          script: |
            const mode = process.env.QUEUE_MODE;
            if (!['', 'disabled', 'enabled'].includes(mode)) throw new Error('Unknown merge queue mode.');
            const inputs = JSON.parse(process.env.QUEUE_INPUTS);
            const candidate = ['queue_pr', 'queue_head', 'queue_base', 'queue_ticket'].some(key => inputs[key]);
            let source = context.sha;
            let full = true;
            if (mode === 'enabled') {
              const { execution } = require('./eng/merge-queue/policy.cjs');
              full = execution({ modeValue: mode, eventName: context.eventName,
                ref: context.ref, sha: context.sha, inputs }).full;
              if (candidate) {
                const { admit } = require('./eng/merge-queue/github.cjs');
                source = await admit({ github, context, inputs: { ...inputs, app_id: process.env.QUEUE_APP_ID } });
              }
            } else if (candidate) {
              throw new Error('Candidate dispatch requires the enabled queue.');
            }
            core.setOutput('full', String(full));
            core.setOutput('source', source);
            core.setOutput('candidate', String(candidate));
            if (!full) core.notice('Full validation waits for GitHub merge queue admission.');

  version:
    name: Resolve build version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: admission
    if: needs.admission.outputs.full == 'true'
    outputs:
      version: ${{ steps.version.outputs.version }}
      product-version: ${{ steps.version.outputs.product-version }}
      publish: ${{ needs.admission.outputs.candidate != 'true' && steps.version.outputs.publish || 'false' }}
      already-published: ${{ steps.publication.outputs.already-published }}
      source-revision: ${{ needs.admission.outputs.source }}
    steps:
      - name: Check out complete version history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.admission.outputs.source }}
          persist-credentials: false
          fetch-depth: 0
      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Resolve main GitVersion or feature proof version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -eq 'refs/heads/main' -or $env:GITHUB_REF -like 'refs/tags/*') {
            dotnet tool restore
            if ($LASTEXITCODE -ne 0) { throw 'Local tool restore failed.' }
          }
          $parameters = @{}
          if ('${{ needs.admission.outputs.candidate }}' -eq 'true') {
            $parameters.ExpectedRevision = '${{ needs.admission.outputs.source }}'
            $parameters.ValidationOnly = $true
          }
          $resolved = ./eng/Get-BuildVersion.ps1 @parameters
          "version=$($resolved.Version)" >> $env:GITHUB_OUTPUT
          "product-version=$($resolved.ProductVersion)" >> $env:GITHUB_OUTPUT
          "publish=$($resolved.Publish.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Check exact-version release before rebuilding
        id: publication
        if: steps.version.outputs.publish == 'true' && needs.admission.outputs.candidate != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $state = ./eng/Publish-GitHubRelease.ps1 -Action Check -Version "$env:BUILD_VERSION" -SourceRevision "$env:GITHUB_SHA"
          "already-published=$($state.AlreadyPublished.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

  portable-test-comparison:
    name: Compare portable test scheduling
    if: github.event_name == 'workflow_dispatch' && inputs.compare_portable_tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: version
    env:
      Version: ${{ needs.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/packages.lock.json

      - name: Restore locked dependencies
        run: dotnet restore Kora.slnx --locked-mode

      - name: Build the same Release solution as portable CI once
        run: dotnet build Kora.slnx --configuration Release --no-restore

      - name: Compare sequential and parallel execution
        shell: pwsh
        run: ./eng/Compare-PortableTestScheduling.ps1 -ResultsDirectory (Join-Path $env:RUNNER_TEMP 'kora-portable-test-scheduling')

      - name: Upload scheduling comparison
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portable-test-scheduling-comparison
          path: ${{ runner.temp }}/kora-portable-test-scheduling
          if-no-files-found: error

  native-evidence-comparison:
    name: Compare native fixture evidence
    if: github.event_name == 'workflow_dispatch' && inputs.compare_native_evidence
    runs-on: windows-latest
    timeout-minutes: 30
    needs: version
    env:
      Version: ${{ needs.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/packages.lock.json

      - name: Restore locked dependencies
        run: dotnet restore tests/Kora.Windows.IntegrationTests/Kora.Windows.IntegrationTests.csproj --locked-mode

      - name: Build the same Windows integration tests once
        run: dotnet build tests/Kora.Windows.IntegrationTests/Kora.Windows.IntegrationTests.csproj --configuration Release --runtime win-x64 --no-restore

      - name: Compare native fixture evidence modes
        shell: pwsh
        run: .\eng\Compare-NativeFixtureEvidence.ps1 -ResultsDirectory (Join-Path $env:RUNNER_TEMP 'kora-native-fixture-evidence')

      - name: Upload native fixture evidence comparison
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-fixture-evidence-comparison
          path: ${{ runner.temp }}/kora-native-fixture-evidence
          if-no-files-found: error

  portable:
    name: Portable build, tests, coverage, and package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: version
    if: needs.version.outputs.already-published != 'true'
    env:
      Version: ${{ needs.version.outputs.version }}
      SOURCE_REVISION: ${{ needs.version.outputs.source-revision }}

    steps:
      # Pin third-party actions to immutable commits to prevent a moved tag from changing trusted CI code.
      # Dependabot still tracks the version comments and proposes reviewed commit updates.
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.source-revision }}
          persist-credentials: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/packages.lock.json

      - name: Restore locked dependencies
        run: dotnet restore Kora.slnx --locked-mode

      - name: Restore local tools
        run: dotnet tool restore

      - name: Enforce dependency license policy
        shell: pwsh
        run: ./eng/Test-DependencyLicenses.ps1

      - name: Build solution without restore
        run: dotnet build Kora.slnx --configuration Release --no-restore

      # Publication tests use a fake CLI, including abrupt child exits under the Actions pwsh wrapper.
      - name: Test version and draft-publication process policy
        shell: pwsh
        run: |
          ./eng/Test-BuildVersion.ps1
          ./eng/Test-GitHubRelease.ps1

      - name: Test Windows integration scheduling contracts
        shell: pwsh
        run: ./eng/Test-WindowsIntegrationScheduling.ps1

      - name: Test portable test scheduling contracts
        shell: pwsh
        run: ./eng/Test-PortableTestScheduling.ps1

      - name: Enforce dependency and portable API boundaries
        shell: pwsh
        run: ./eng/Test-Architecture.ps1

      - name: Test hosted merge queue policy and workflow contracts
        run: node --test eng/merge-queue/*.test.cjs

      - name: Test static immutable source-tool distribution
        shell: pwsh
        run: ./eng/Test-SourceToolsContracts.ps1 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'kora-source-tool-contracts')

      - name: Upload static source-tool contract results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-tool-contracts
          path: ${{ runner.temp }}/kora-source-tool-contracts/tests.json
          if-no-files-found: error

      - name: Test portable projects with coverage
        run: >
          dotnet test
          --solution Kora.UnitTests.slnx
          --configuration Release
          --no-build
          --results-directory .net-test-artifacts/unit
          --results-directory-layout per-module
          --report-trx
          --coverlet
          --coverlet-output-format cobertura
          --coverlet-file-prefix unit

      - name: Generate and enforce coverage report
        run: >
          dotnet reportgenerator
          "-reports:.net-test-artifacts/**/*.coverage.cobertura.*.xml"
          "-targetdir:.net-test-artifacts/coverage-report"
          "-reporttypes:Cobertura;MarkdownSummaryGithub;TextSummary"
          "-assemblyfilters:+Kora.Core;+Kora.Application;+Kora.Tools;+Kora.Definitions"

      - name: Enforce coverage thresholds
        shell: pwsh
        run: >
          ./eng/Assert-CodeCoverage.ps1
          -ReportPath .net-test-artifacts/coverage-report/Cobertura.xml
          -MinimumLine 100
          -MinimumBranch 100

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: |
            .net-test-artifacts/**/*.trx
            .net-test-artifacts/**/*.coverage.cobertura.*.xml
            src/Kora.Core/bin/Release/net10.0/Kora.Core.dll
            src/Kora.Core/bin/Release/net10.0/Kora.Core.pdb
            src/Kora.Application/bin/Release/net10.0/Kora.Application.dll
            src/Kora.Application/bin/Release/net10.0/Kora.Application.pdb
            src/Kora.Tools/bin/Release/net10.0/Kora.Tools.dll
            src/Kora.Tools/bin/Release/net10.0/Kora.Tools.pdb
            src/Kora.Definitions/bin/Release/net10.0/Kora.Definitions.dll
            src/Kora.Definitions/bin/Release/net10.0/Kora.Definitions.pdb
          if-no-files-found: error
          include-hidden-files: true

      - name: Upload coverage report
        if: always() && hashFiles('.net-test-artifacts/coverage-report/Cobertura.xml') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: .net-test-artifacts/coverage-report
          if-no-files-found: error
          include-hidden-files: true

      - name: Package exact-revision source tools without executing them
        shell: pwsh
        env:
          BUILD_VERSION: ${{ needs.version.outputs.version }}
        run: >
          ./eng/Build-SourceTools.ps1 -Revision "$env:SOURCE_REVISION"
          -Version "$env:BUILD_VERSION" -OutputDirectory artifacts/source-tools

      - name: Retain main source-tool candidate
        if: needs.version.outputs.publish == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Kora-source-tools
          path: artifacts/source-tools
          if-no-files-found: error

      - name: Publish Windows x64 application
        run: >
          dotnet publish src/Kora/Kora.csproj
          --configuration Release
          --runtime win-x64
          --self-contained false
          --no-restore
          --output artifacts/Kora-win-x64

      - name: Publish Windows x86 application
        run: >
          dotnet publish src/Kora/Kora.csproj
          --configuration Release
          --runtime win-x86
          --self-contained false
          --no-restore
          --output artifacts/Kora-win-x86

      - name: Add dependency license texts to publish artifacts
        shell: pwsh
        run: |
          foreach ($destination in @('artifacts/Kora-win-x64', 'artifacts/Kora-win-x86')) {
            foreach ($licenseDirectory in @('licenses', 'package-notices')) {
              Copy-Item `
                -Path (Join-Path 'artifacts/license-compliance' $licenseDirectory) `
                -Destination (Join-Path $destination $licenseDirectory) `
                -Recurse
            }
          }

      - name: Record exact x64 application payload
        shell: pwsh
        run: |
          foreach ($rid in @('win-x64', 'win-x86')) {
            ./eng/Test-InstallerPayload.ps1 -PayloadPath "artifacts/Kora-$rid" -Version "$env:Version" -SourceRevision "$env:SOURCE_REVISION" -WriteManifest
          }

      - name: Inspect approved Windows native and runtime payloads
        shell: pwsh
        run: |
          foreach ($rid in @('win-x64', 'win-x86')) {
            $evidence = "artifacts/publish-inspection/$rid"
            ./eng/Test-EmbeddedSkillResources.ps1 -AssemblyPath "artifacts/Kora-$rid/Kora.Definitions.dll"
            ./eng/Inspect-Publish.ps1 -Payload "artifacts/Kora-$rid" -Rid $rid -Revision "$env:SOURCE_REVISION" -EvidenceDirectory $evidence -BuildOrigin "GitHub Actions $env:GITHUB_RUN_ID/$env:GITHUB_RUN_ATTEMPT; Linux cross-publish; static-only"
            $tests = Join-Path $env:RUNNER_TEMP "kora-publish-contracts-$rid"
            ./eng/Test-PublishContracts.ps1 -Payload "artifacts/Kora-$rid" -Rid $rid -Inspection "$evidence/payload.json" -OutputDirectory $tests
            Copy-Item -LiteralPath (Join-Path $tests 'tests.json') -Destination "$evidence/contract-tests.json"
          }

      - name: Upload static publish inspection
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publish-inspection
          path: artifacts/publish-inspection
          if-no-files-found: error

      - name: Upload dependency license audit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-license-audit
          path: artifacts/license-compliance
          if-no-files-found: error

      - name: Upload Windows x64 application
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Kora-win-x64
          path: artifacts/Kora-win-x64
          if-no-files-found: error
          include-hidden-files: true

      - name: Upload Windows x86 application
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Kora-win-x86
          path: artifacts/Kora-win-x86
          if-no-files-found: error
          include-hidden-files: true

  queue-feedback:
    name: Queue policy feedback
    if: vars.KORA_MERGE_QUEUE_MODE == 'enabled' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node --test eng/merge-queue/*.test.cjs
      - shell: pwsh
        run: ./eng/Test-WindowsIntegrationScheduling.ps1

  windows-integration-shards:
    name: Windows integration shard (${{ matrix.shard }})
    runs-on: windows-latest
    # Isolate existing shards on separate runners; product, test and job deadlines are unchanged.
    timeout-minutes: 30
    needs: version
    if: needs.version.outputs.already-published != 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [storage-heavy, storage-other, ui-definitions, native-ux, ui-platform]
    env:
      Version: ${{ needs.version.outputs.version }}
      KORA_TEST_NATIVE_EVIDENCE_MODE: ${{ matrix.shard == 'native-ux' && 'buffered' || 'synchronous' }}

    steps:
      # Keep the Windows job on the same reviewed action revisions as the portable job.
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.source-revision }}
          persist-credentials: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/packages.lock.json

      - name: Restore locked dependencies
        run: dotnet restore tests/Kora.Windows.IntegrationTests/Kora.Windows.IntegrationTests.csproj --locked-mode

      - name: Build Windows integration tests without restore
        run: dotnet build tests/Kora.Windows.IntegrationTests/Kora.Windows.IntegrationTests.csproj --configuration Release --runtime win-x64 --no-restore

      - name: Test payload rejection before packaging
        if: matrix.shard == 'storage-other'
        shell: pwsh
        run: .\eng\Test-InstallerPayloadContracts.ps1

      - name: Test build-only source ownership and recovery
        if: matrix.shard == 'storage-other'
        shell: pwsh
        run: .\eng\Test-SourceBootstrap.ps1 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'kora-source-bootstrap-contracts')

      - name: Upload source bootstrap fixture results
        if: always() && matrix.shard == 'storage-other'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-bootstrap-contracts
          path: ${{ runner.temp }}/kora-source-bootstrap-contracts/tests.json
          if-no-files-found: error

      - name: Run Windows integration tests
        shell: pwsh
        run: .\eng\Run-WindowsIntegrationTests.ps1 -Shard '${{ matrix.shard }}'

      - name: Upload Windows test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-test-results-${{ matrix.shard }}
          path: |
            .net-test-artifacts/windows/**/*.trx
            .net-test-artifacts/windows/**/console.log
          if-no-files-found: error
          include-hidden-files: true

  windows-integration:
    name: Windows integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [admission, version, windows-integration-shards]
    if: always() && needs.version.outputs.already-published != 'true' && (needs.admission.result != 'success' || needs.admission.outputs.full != 'false')
    steps:
      - name: Require every Windows shard to succeed
        shell: pwsh
        env:
          SHARD_RESULT: ${{ needs.windows-integration-shards.result }}
        run: |
          if ($env:SHARD_RESULT -cne 'success') {
            throw "Windows integration shards did not all succeed: '$env:SHARD_RESULT'."
          }

  installer:
    name: Build WiX MSI and custom Burn setup
    runs-on: windows-latest
    timeout-minutes: 20
    needs: [version, portable]
    env:
      SOURCE_REVISION: ${{ needs.version.outputs.source-revision }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.source-revision }}
          persist-credentials: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/packages.lock.json

      - name: Download exact Linux-published x64 application
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Kora-win-x64
          path: artifacts/Kora-win-x64

      - name: Verify payload digests and build identity
        shell: pwsh
        env:
          BUILD_VERSION: ${{ needs.version.outputs.version }}
        run: >
          .\eng\Test-InstallerPayload.ps1
          -PayloadPath .\artifacts\Kora-win-x64
          -Version "$env:BUILD_VERSION"
          -SourceRevision "$env:SOURCE_REVISION"

      - name: Restore locked installer dependencies
        shell: pwsh
        run: |
          dotnet restore .\installer\Kora.Msi\Kora.Msi.wixproj --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore .\installer\Kora.Bundle\Kora.Bundle.wixproj --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build MSI and Burn bundle without installing
        id: package
        shell: pwsh
        env:
          BUILD_VERSION: ${{ needs.version.outputs.version }}
          PRODUCT_VERSION: ${{ needs.version.outputs.product-version }}
        run: >
          .\eng\Build-Installer.ps1
          -Version "$env:BUILD_VERSION"
          -ProductVersion "$env:PRODUCT_VERSION"
          -ApplicationPayloadPath .\artifacts\Kora-win-x64
          -NoRestore

      # Feature and PR builds compile setup but never upload/publish its bytes.
      - name: Retain main installer candidate
        if: needs.version.outputs.publish == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Kora-Setup-${{ needs.version.outputs.version }}-win-x64
          path: ${{ steps.package.outputs.installer-path }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [version, portable, windows-integration, installer]
    if: needs.version.outputs.publish == 'true' && needs.version.outputs.already-published != 'true' && inputs.queue_ticket == ''
    permissions:
      contents: write
    concurrency:
      group: release-${{ needs.version.outputs.version }}
      cancel-in-progress: false
    steps:
      - name: Check out trusted main/tag source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download x64 application
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Kora-win-x64
          path: artifacts/release/Kora-win-x64

      - name: Download x86 application candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Kora-win-x86
          path: artifacts/release/Kora-win-x86

      - name: Download inspected installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Kora-Setup-${{ needs.version.outputs.version }}-win-x64
          path: artifacts/release/installer

      - name: Download statically verified source tools
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Kora-source-tools
          path: artifacts/release/source-tools

      - name: Verify bytes, generate notes and publish beta/stable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_VERSION: ${{ needs.version.outputs.version }}
        run: >
          ./eng/Publish-GitHubRelease.ps1
          -Action Publish
          -Version "$env:BUILD_VERSION"
          -SourceRevision "$env:GITHUB_SHA"
          -ArtifactPath artifacts/release
