workflow: GitHubFlow/v1
next-version: 0.1.0
# Match ModelBuilder's GitVersion 6 ContinuousDelivery branch policy.
branches:
  main:
    label: beta
    mode: ContinuousDelivery
  feature:
    mode: ContinuousDelivery
  unknown:
    mode: ContinuousDelivery
    # Tag checkouts are detached; retain the exact tagged version.
    prevent-increment:
      when-current-commit-tagged: true
  hotfix:
    regex: ^hotfix(es)?[/-]
    source-branches:
      - main
    label: useBranchName
    mode: ContinuousDelivery
