<svg xmlns="http://www.w3.org/2000/svg" width="760" height="220" viewBox="0 0 760 220" role="img" aria-labelledby="title description">
  <title id="title">Kora mark small-size study</title>
  <desc id="description">The Kora vertical loop rendered at 16, 20, 24, and 32 pixels on a dark system surface.</desc>
  <defs>
    <linearGradient id="state-spectrum" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F49C9C" />
      <stop offset="0.18" stop-color="#F0CC83" />
      <stop offset="0.34" stop-color="#9BDFAC" />
      <stop offset="0.49" stop-color="#6AE1DA" />
      <stop offset="0.60" stop-color="#B8D9EC" />
      <stop offset="0.77" stop-color="#80B7FF" />
      <stop offset="1" stop-color="#AF9BFF" />
    </linearGradient>
    <path id="loop" d="M128 28 C78 28 52 49 52 88 C52 119 79 141 128 160 C177 179 204 201 204 232 C204 271 178 292 128 292 C78 292 52 271 52 232 C52 201 79 179 128 160 C177 141 204 119 204 88 C204 49 178 28 128 28" />
  </defs>

  <rect width="760" height="220" rx="22" fill="#101216" />
  <text x="30" y="42" fill="#E8ECF2" font-family="Segoe UI, sans-serif" font-size="17" font-weight="600">Actual-size tray study</text>
  <text x="30" y="67" fill="#929BA9" font-family="Segoe UI, sans-serif" font-size="13">Colour continuity remains visible; state identification stays with the presence, not the static icon.</text>

  <g transform="translate(84 108) scale(0.05)">
    <use href="#loop" fill="none" stroke="url(#state-spectrum)" stroke-linecap="round" stroke-linejoin="round" stroke-width="40" />
  </g>
  <text x="70" y="164" fill="#B8BEC8" font-family="Segoe UI, sans-serif" font-size="12">16 px</text>

  <g transform="translate(236 104) scale(0.0625)">
    <use href="#loop" fill="none" stroke="url(#state-spectrum)" stroke-linecap="round" stroke-linejoin="round" stroke-width="38" />
  </g>
  <text x="222" y="164" fill="#B8BEC8" font-family="Segoe UI, sans-serif" font-size="12">20 px</text>

  <g transform="translate(388 100) scale(0.075)">
    <use href="#loop" fill="none" stroke="url(#state-spectrum)" stroke-linecap="round" stroke-linejoin="round" stroke-width="36" />
  </g>
  <text x="374" y="164" fill="#B8BEC8" font-family="Segoe UI, sans-serif" font-size="12">24 px</text>

  <g transform="translate(540 92) scale(0.10)">
    <use href="#loop" fill="none" stroke="url(#state-spectrum)" stroke-linecap="round" stroke-linejoin="round" stroke-width="32" />
  </g>
  <text x="526" y="164" fill="#B8BEC8" font-family="Segoe UI, sans-serif" font-size="12">32 px</text>

  <line x1="670" y1="96" x2="670" y2="166" stroke="#303640" />
  <text x="700" y="120" fill="#6AE1DA" font-family="Segoe UI, sans-serif" font-size="18" text-anchor="middle">●</text>
  <text x="700" y="146" fill="#929BA9" font-family="Segoe UI, sans-serif" font-size="11" text-anchor="middle">system</text>
  <text x="700" y="161" fill="#929BA9" font-family="Segoe UI, sans-serif" font-size="11" text-anchor="middle">surface</text>
</svg>
