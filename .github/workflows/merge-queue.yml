name: Merge queue controller
run-name: Reviewed bootstrap retirement of PR 690

# Recovery-only branch. Never merge this workflow into main.
on:
  workflow_dispatch:
    inputs:
      acknowledge:
        description: Administrator verified no bypass actors on the exact lock revision and authorizes this ticket only
        type: boolean
        required: true
        default: false
      lock_ruleset:
        description: Verified active no-bypass lock for this immutable bootstrap branch
        type: string
        required: true
      lock_version:
        description: Immutable current ruleset history version verified by the administrator with full actor visibility
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: merge-queue-controller
  cancel-in-progress: false
  queue: max

jobs:
  bootstrap:
    if: vars.KORA_MERGE_QUEUE_MODE == 'enabled' && inputs.acknowledge == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: merge-queue
    steps:
      - name: Check out approved immutable recovery source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Create bounded repository queue identity
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app
        with:
          client-id: ${{ vars.KORA_MERGE_QUEUE_CLIENT_ID }}
          private-key: ${{ secrets.KORA_MERGE_QUEUE_PRIVATE_KEY }}
          permission-actions: write
          permission-administration: read
          permission-checks: read
          permission-contents: write

      - name: Retire only the reviewed terminal admission rejection
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          QUEUE_APP_ID: ${{ vars.KORA_MERGE_QUEUE_APP_ID }}
          QUEUE_INPUTS: ${{ toJSON(inputs) }}
          QUEUE_RUN_ATTEMPT: ${{ github.run_attempt }}
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            const { GitHubQueue } = require('./eng/merge-queue/github.cjs');
            const { bootstrap } = require('./eng/merge-queue/bootstrap-retirement.cjs');
            const api = new GitHubQueue(github, context, core, process.env.QUEUE_APP_ID);
            let result = 'failed';
            try {
              result = await bootstrap(api, { context, inputs: JSON.parse(process.env.QUEUE_INPUTS),
                attempt: Number(process.env.QUEUE_RUN_ATTEMPT) });
              core.notice(`Reviewed bootstrap: ${result}.`);
            } finally {
              await api.summarize(result);
            }
