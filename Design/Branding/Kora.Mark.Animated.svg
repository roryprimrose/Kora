    <use class="segment" href="#loop" stroke="#D29CCE" stroke-dashoffset="-650" style="--delay: -7.428571s" />
    <use class="segment" href="#loop" stroke="#DA9CC1" stroke-dashoffset="-662.5" style="--delay: -7.571429s" />
    <use class="segment" href="#loop" stroke="#E39CB5" stroke-dashoffset="-675" style="--delay: -7.714286s" />
    <use class="segment" href="#loop" stroke="#EB9CA8" stroke-dashoffset="-687.5" style="--delay: -7.857143s" />
  </g>
  <use
      href="#loop"
      fill="none"
      opacity="0.14"
      stroke="#FFFFFF"
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-width="5" />
</svg>
