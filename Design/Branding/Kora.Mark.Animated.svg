<svg xmlns="http://www.w3.org/2000/svg" width="256" height="320" viewBox="0 0 256 320" role="img" aria-labelledby="title description">
  <title id="title">Animated Kora vertical infinity loop</title>
  <desc id="description">Kora's seven constellation state colours travel continuously around a softly squared vertical infinity ribbon.</desc>
  <style>
    .segment {
      animation: travel 8s linear infinite;
      animation-delay: var(--delay);
      stroke-dasharray: 16 684;
    }

    @keyframes travel {
      from {
        stroke-dashoffset: 0;
      }

      to {
        stroke-dashoffset: -700;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .segment {
        animation: none;
      }
    }
  </style>
  <defs>
    <path
        id="loop"
        pathLength="700"
        d="M128 28 C78 28 52 49 52 88 C52 119 79 141 128 160 C177 179 204 201 204 232 C204 271 178 292 128 292 C78 292 52 271 52 232 C52 201 79 179 128 160 C177 141 204 119 204 88 C204 49 178 28 128 28" />
    <filter id="blend" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="3" />
    </filter>
    <mask id="ribbon-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="320">
      <use
          href="#loop"
          fill="none"
          stroke="#FFFFFF"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="27" />
    </mask>
  </defs>
  <g
      fill="none"
      filter="url(#blend)"
      mask="url(#ribbon-mask)"
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-width="33">
    <use class="segment" href="#loop" stroke="#F49C9C" stroke-dashoffset="0" style="--delay: 0s" />
    <use class="segment" href="#loop" stroke="#F4A299" stroke-dashoffset="-12.5" style="--delay: -0.142857s" />
    <use class="segment" href="#loop" stroke="#F3A896" stroke-dashoffset="-25" style="--delay: -0.285714s" />
    <use class="segment" href="#loop" stroke="#F2AE93" stroke-dashoffset="-37.5" style="--delay: -0.428571s" />
    <use class="segment" href="#loop" stroke="#F2B490" stroke-dashoffset="-50" style="--delay: -0.571429s" />
    <use class="segment" href="#loop" stroke="#F2BA8C" stroke-dashoffset="-62.5" style="--delay: -0.714286s" />
    <use class="segment" href="#loop" stroke="#F1C089" stroke-dashoffset="-75" style="--delay: -0.857143s" />
    <use class="segment" href="#loop" stroke="#F0C686" stroke-dashoffset="-87.5" style="--delay: -1s" />
    <use class="segment" href="#loop" stroke="#F0CC83" stroke-dashoffset="-100" style="--delay: -1.142857s" />
    <use class="segment" href="#loop" stroke="#E5CE88" stroke-dashoffset="-112.5" style="--delay: -1.285714s" />
    <use class="segment" href="#loop" stroke="#DBD18D" stroke-dashoffset="-125" style="--delay: -1.428571s" />
    <use class="segment" href="#loop" stroke="#D0D392" stroke-dashoffset="-137.5" style="--delay: -1.571429s" />
