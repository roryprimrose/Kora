name: Development Preview
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_NOLOGO: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Publish explicit opt-in development payload
        shell: pwsh
        run: .\eng\Publish-DevelopmentPreview.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Kora-DevelopmentPreview-win-x64
          path: |
            artifacts/development-preview/run-*/Kora-DevelopmentPreview-win-x64.zip
            artifacts/development-preview/run-*/preview-manifest.json
          if-no-files-found: error
