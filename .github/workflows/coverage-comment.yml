name: Coverage PR comment

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: write

jobs:
  comment:
    name: Post portable coverage
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'pull_request' ||
       (github.event.workflow_run.event == 'workflow_dispatch' &&
        startsWith(github.event.workflow_run.display_title, 'Merge queue PR #')))
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Resolve validated coverage destination
        id: destination
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          QUEUE_APP_ID: ${{ vars.KORA_MERGE_QUEUE_APP_ID }}
        with:
          script: |
            const run = context.payload.workflow_run;
            if (run.event === 'pull_request') {
              const number = run.pull_requests[0]?.number;
              if (!number) throw new Error('PR coverage run has no associated pull request.');
              core.setOutput('number', number);
            } else {
              const match = /^Merge queue PR #([1-9][0-9]*) \[([0-9a-f-]{36})\]$/.exec(run.display_title);
              if (!match || run.head_branch !== 'main') throw new Error('Invalid candidate coverage source.');
              const number = Number(match[1]);
              const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: number });
              const checks = await github.paginate(github.rest.checks.listForRef,
                { ...context.repo, ref: pr.head.sha, check_name: 'Merge admission', per_page: 100 });
              if (!checks.some(check => check.app.id === Number(process.env.QUEUE_APP_ID) &&
                check.external_id === match[2])) {
                core.notice('Candidate head changed; its coverage is not posted as current PR evidence.');
                return;
              }
              core.setOutput('number', number);
            }

      - name: Verify coverage producer
        if: steps.destination.outputs.number != ''
        id: producer
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const run = context.payload.workflow_run;
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun,
              { ...context.repo, run_id: run.id, filter: 'latest', per_page: 100 });
            const producers = jobs.filter(job => job.name === 'Portable build, tests, coverage, and package');
            if (producers.length !== 1 || producers[0].status !== 'completed') {
              throw new Error('Coverage source must have exactly one completed portable build job.');
            }
            const producer = producers[0];
            const feedback = jobs.filter(job => job.name === 'Queue policy feedback');
            if (run.event === 'pull_request' && producer.conclusion === 'skipped' &&
              feedback.length === 1 && feedback[0].status === 'completed' && feedback[0].conclusion === 'success') {
              core.notice('Policy-only PR run; coverage was not produced and no coverage comment is posted.');
              return;
            }
            if (producer.conclusion !== 'success') {
              throw new Error('Coverage source portable build did not succeed.');
            }
            core.setOutput('ready', 'true');

      - name: Download coverage report
        if: steps.producer.outputs.ready == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-report
          path: coverage-report
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Post or update coverage comment
        if: steps.producer.outputs.ready == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const marker = '<!-- portable-code-coverage -->';
            const issue_number = Number('${{ steps.destination.outputs.number }}');
            const summary = fs.readFileSync('coverage-report/SummaryGithub.md', 'utf8').trim();
            const body = `${marker}\n${summary}`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100
            });
            const existing = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' &&
              comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body
              });
            }
